#阿瑞斯套装：YSM外观切换；以服务端配置为准，修改后重启游戏或服务器。
[ares]
	#默认开启；关闭后，完整阿瑞斯装备或对应饰品不替换YSM模型，已自动切换的外观恢复原选择，装备属性不变。
	change_ysm_model = true


[dark_crystal]
# 一阶龙印斩单个龙之势基础伤害；范围0～1000000。
dragon_tier1_damage = 15.0
# 二阶龙印斩单个龙之势基础伤害；范围0～1000000。
dragon_tier2_damage = 20.0
# 绝·怒意每层额外伤害比例，0.05为5%；范围0～10。
wrath_damage_per_layer = 0.05
# 二阶绝·怒意每层减伤比例，0.02为2%；范围0～1，最终减伤上限100%。
wrath_reduction_per_layer = 0.02
# 合法水晶刀刃对同把武器怒意伤害及减伤的倍率；范围0～100。
crystal_blade_multiplier = 2.0
# 普通力量解放消耗当前生命的比例；范围0～1，保留最低正生命值，终极仍锁定1点。
liberation_health_cost_fraction = 0.70
# 中心爆发基础伤害；范围0～1000000，0关闭伤害。
liberation_blast_damage = 30.0
# 中心爆发及起手击退判定半径（格）；范围0～64。
liberation_blast_radius = 6.0
# 技能期间额外移速比例，0.20为20%；范围0～10。
liberation_speed_bonus = 0.20
# 技能期间龙之势伤害倍率；范围0～100。
liberation_dragon_multiplier = 2.0
# 技能期间怒意减伤倍率；范围0～100，最终减伤上限100%。
liberation_wrath_reduction_multiplier = 2.0
# 普通护盾上限相对最大生命值的倍率；范围0～100。
shield_capacity_multiplier = 2.0
# 合法水晶核心护盾上限相对最大生命值的倍率；范围0～100。
core_shield_capacity_multiplier = 4.0
# 普通实际消耗生命转为初始护盾的倍率；范围0～100，受上限限制。
sacrifice_shield_multiplier = 2.0
# 合法水晶核心实际消耗生命转为初始护盾的倍率；范围0～100，受上限限制。
core_sacrifice_shield_multiplier = 4.0
# 终极固定额外伤害比例，0.99为99%，创造之石共用；范围0～100。
ultimate_wrath_bonus = 0.99
# 终极自然结束恢复到最大生命的比例；范围0～1，0不执行结束回血。
ending_health_fraction = 0.30


